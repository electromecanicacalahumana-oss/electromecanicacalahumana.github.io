<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reto del cepillado | ODONTOSEÑAS LSB</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e6faf7,#fff7e8);color:#203943}.wrap{width:min(850px,92%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 0}.brand{color:#075e68;font-weight:900;text-decoration:none;display:flex;align-items:center;gap:9px}.brand img{width:43px;height:48px;object-fit:contain;background:#fff;border-radius:8px}.back,.btn{padding:11px 15px;border-radius:12px;text-decoration:none;font-weight:bold;border:0;cursor:pointer}.back{background:white;border:1px solid #c6e4e7;color:#075e68}.hero{text-align:center;padding:15px 0}.hero .emoji{font-size:55px}.hero h1{color:#075e68;font-size:clamp(30px,5vw,42px);margin:8px}.hero p{color:#607982;line-height:1.6}.card{background:white;border:1px solid #dcebed;border-radius:20px;padding:clamp(20px,4vw,32px);box-shadow:0 12px 30px #123c5010}.progress{height:8px;background:#e4f0f1;border-radius:10px;overflow:hidden;margin-bottom:20px}.bar{height:100%;background:#20b5a5;width:0;transition:.2s}.question{font-size:23px;line-height:1.4}.answers{display:grid;gap:10px}.answer{padding:14px;border:2px solid #e1edef;border-radius:12px;background:white;text-align:left;font-size:15px;cursor:pointer;color:#203943}.answer:hover:not(:disabled){border-color:#087f8c}.correct{background:#edfff4;border-color:#36a269}.wrong{background:#fff1ef;border-color:#dc7770}.feedback{display:none;margin-top:15px;padding:13px;border-radius:12px;line-height:1.5}.feedback.show{display:block}.good{background:#edfff4;color:#145c3c}.bad{background:#fff1ef;color:#8f2119}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}.btn{background:#087f8c;color:white}.btn:disabled{opacity:.4;cursor:not-allowed}.result{text-align:center;padding:20px}.result .emoji{font-size:65px}.result h2{color:#075e68}.note{text-align:center;font-size:12px;color:#607982;margin:20px 0 35px}@media(max-width:500px){.top{align-items:flex-start}.question{font-size:20px}.row{align-items:flex-end}}
</style></head><body><main class="wrap"><div class="top"><a class="brand" href="index.html"><img src="logo_carrera_odontologia.png" alt="Logo de Odontología"> ODONTOSEÑAS LSB</a><a class="back" href="juegos.html">← Menú de juegos</a></div>
<section class="hero"><div class="emoji">🪥🦷</div><h1>Reto del cepillado</h1><p>Responde las preguntas y descubre hábitos para cuidar tu sonrisa.</p></section>
<section class="card" id="card"><div class="progress"><div class="bar" id="bar"></div></div><p id="count"></p><h2 class="question" id="q"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback" role="status"></div><div class="row"><span id="score">Puntos: 0</span><button class="btn" id="next" disabled>Siguiente →</button></div></section>
<p class="note">Los emojis sirven como apoyo visual y no sustituyen señas reales de la Lengua de Señas Boliviana.</p></main>
<script>
const data=[
{q:"¿Cuánto tiempo se recomienda dedicar al cepillado?",a:["Unos 2 minutos","10 segundos","Solo unos segundos"],c:0,e:"¡Correcto! Un cepillado de unos dos minutos ayuda a limpiar todas las superficies."},
{q:"¿Cuántas veces al día debemos cepillarnos?",a:["Una vez a la semana","Al menos dos veces al día","Solo cuando duele"],c:1,e:"¡Muy bien! Cepíllate al menos dos veces al día con pasta dental con flúor."},
{q:"¿Qué tipo de movimiento conviene usar?",a:["Suave y cuidadoso","Muy fuerte","Rápido y sin orden"],c:0,e:"Los movimientos suaves ayudan a limpiar sin lastimar las encías."},
{q:"¿Qué parte de la boca debemos limpiar?",a:["Solo los dientes de adelante","Todas las superficies de los dientes y la lengua","Solo donde se ve comida"],c:1,e:"Hay que limpiar todas las superficies de los dientes y también la lengua con suavidad."},
{q:"¿Qué ayuda a limpiar entre los dientes?",a:["Hilo dental","Un alfiler","Una hoja de papel"],c:0,e:"El hilo dental ayuda a limpiar los espacios donde el cepillo no llega fácilmente."}
];
let i=0,score=0,locked=false;const $=x=>document.getElementById(x);
function render(){locked=false;const d=data[i];$("count").textContent=`Pregunta ${i+1} de ${data.length}`;$("q").textContent=d.q;$("answers").innerHTML="";$("feedback").className="feedback";$("feedback").textContent="";$("next").disabled=true;$("next").textContent=i===data.length-1?"Ver resultado ★":"Siguiente →";$("bar").style.width=`${i/data.length*100}%`;data[i].a.forEach((t,n)=>{const b=document.createElement("button");b.className="answer";b.textContent=String.fromCharCode(65+n)+". "+t;b.onclick=()=>choose(n);$("answers").appendChild(b)});$("score").textContent="Puntos: "+score}
function choose(n){if(locked)return;locked=true;const d=data[i];[...$("answers").children].forEach((b,j)=>{b.disabled=true;if(j===d.c)b.classList.add("correct");if(j===n&&n!==d.c)b.classList.add("wrong")});if(n===d.c){score+=10;$("feedback").className="feedback show good";$("feedback").textContent="✓ ¡Correcto! "+d.e}else{$("feedback").className="feedback show bad";$("feedback").textContent="Sigue aprendiendo. "+d.e}$("score").textContent="Puntos: "+score;$("bar").style.width=`${(i+1)/data.length*100}%`;$("next").disabled=false}
function results(){$("card").innerHTML=`<div class="result"><div class="emoji">🌟</div><h2>¡Reto completado!</h2><p>Tu puntuación final es</p><h2>${score} puntos</h2><button class="btn" onclick="location.reload()">Jugar otra vez ↻</button> <a class="back" href="juegos.html">Volver al menú</a></div>`}
$("next").onclick=()=>{if(!locked)return;if(i<data.length-1){i++;render()}else results()};render();
</script></body></html>
